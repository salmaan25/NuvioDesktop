name: Upstream sync

# Daily: if official Nuvio has published a newer release, try merging it into our branch here and
# open an issue saying whether it merges cleanly. Nothing is pushed: official releases change their
# own workflow files, and GitHub refuses those from the built-in token without the `workflows`
# permission, which it cannot be given. The merge, tests and tag happen locally.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: salmaan/main
          fetch-depth: 0
          lfs: false
      - name: Find newest official release
        id: find
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioDesktop.git
          git fetch --quiet --no-tags upstream "+refs/tags/*-alpha:refs/tags/*-alpha"
          latest="$(git tag -l '*-alpha' | sort -V | tail -1)"
          current="$(git describe --tags --abbrev=0 --match '*-alpha' HEAD)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Official latest: $latest | our base: $current"
      - name: Report the new release
        if: steps.find.outputs.latest != steps.find.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.find.outputs.latest }}
          CURRENT: ${{ steps.find.outputs.current }}
        run: |
          title="Official Nuvio $LATEST is available"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "An issue for $LATEST is already open."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "trial/$LATEST"
          if git merge --quiet --no-edit --no-ff "$LATEST" >/dev/null 2>&1; then
            result="It merges into \`salmaan/main\` without conflicts."
          else
            conflicts="$(git diff --name-only --diff-filter=U | sed 's/.*/- `&`/')"
            git merge --abort
            result="$(printf 'Merging it into `salmaan/main` conflicts in:\n%s' "$conflicts")"
          fi
          body="$(printf '%s\n\nWe are on `%s`. %s\n\nMerge locally, review the official changes that touch our customizations, run `.fork/test-vs-upstream.sh`, then tag `%s.1`:\n\n```\ngit fetch upstream --tags\ngit switch -c sync/%s salmaan/main\ngit merge %s\n```' \
            "Official Nuvio \`$LATEST\` was released." "$CURRENT" "$result" "$LATEST" "$LATEST" "$LATEST")"
          gh issue create --title "$title" --body "$body"
