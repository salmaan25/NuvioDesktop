name: Fork CI

# Tests every change proposed to our branch (including upstream-sync PRs) against the official
# release it is based on. Fails only on test failures that official Nuvio does not also have.
on:
  pull_request:
    branches: [salmaan/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
      - name: Tests (no new failures vs official base release)
        run: bash .fork/test-vs-upstream.sh
